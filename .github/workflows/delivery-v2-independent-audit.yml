name: Delivery V2 Independent Audit

on:
  workflow_run:
    workflows:
      - Delivery V2 CI
    types:
      - completed

permissions: {}

concurrency:
  group: delivery-v2-independent-audit-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve CRITICAL audit request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_audit: ${{ steps.resolve.outputs.should_audit }}
      should_target_audit: ${{ steps.resolve.outputs.should_target_audit }}
      target_audit_id: ${{ steps.resolve.outputs.target_audit_id }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      runtime_sha: ${{ steps.resolve.outputs.runtime_sha }}
    steps:
      - name: Resolve exact audit trigger PR
        id: resolve
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUNTIME_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const runtimeSha = String(process.env.WORKFLOW_RUNTIME_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(runtimeSha)) {
              core.setFailed('github.workflow_sha did not provide an immutable audit runtime SHA');
              return;
            }
            core.setOutput('runtime_sha', runtimeSha);
            core.setOutput('should_audit', 'false');
            core.setOutput('should_target_audit', 'false');
            core.setOutput('target_audit_id', '');
            if (run.conclusion !== 'success') return;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
              per_page: 100,
            });
            const exact = pulls.filter((pr) => pr.head.sha === run.head_sha);
            if (exact.length !== 1) return;

            const pr = exact[0];
            const sameRepository = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepository) return;
            core.setOutput('pr_number', String(pr.number));

            const lines = String(pr.body || '').split(/\r?\n/).map((line) => line.trim());
            const criticalMarked = lines.includes('DV2-AUDIT-PILOT: critical');
            const marked = criticalMarked;
            const targetMarkers = lines
              .map((line) => line.match(/^DV2-TARGET-AUDIT:\s*([a-z0-9][a-z0-9._-]*)$/))
              .filter(Boolean)
              .map((match) => match[1]);

            if (criticalMarked && targetMarkers.length > 0) {
              core.setFailed('audit trigger PR cannot request both internal and target audit modes');
              return;
            }
            if (targetMarkers.length > 1) {
              core.setFailed('audit trigger PR must contain at most one DV2-TARGET-AUDIT marker');
              return;
            }
            if (marked) core.setOutput('should_audit', sameRepository && marked ? 'true' : 'false');
            if (targetMarkers.length === 1) {
              core.setOutput('should_target_audit', 'true');
              core.setOutput('target_audit_id', targetMarkers[0]);
            }

  audit:
    name: Independent CRITICAL semantic audit
    needs: resolve
    if: needs.resolve.outputs.should_audit == 'true'
    runs-on: [self-hosted, linux, delivery-orchestrator]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    env:
      TARGET_REPOSITORY: ${{ github.repository }}
      TARGET_ISSUE: '27'
      SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      AUDIT_RESULT_PATH: /tmp/delivery-v2-independent-audit-result-${{ github.run_id }}.json
      DELIVERY_ROLE_RUNTIME_ROOT: /tmp/delivery-v2-role-runtime-${{ github.run_id }}
      DELIVERY_ROLE_RUNTIME_WORKER: /tmp/delivery-v2-role-runtime-${{ github.run_id }}/role-runtime-worker.mjs
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'chatgpt' }}
      CODEX_AUDITOR_HOME: ${{ vars.CODEX_AUDITOR_HOME }}
      DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
      DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
    steps:
      - name: Checkout trusted audit runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.runtime_sha }}
          persist-credentials: false

      - name: Validate isolated auditor runtime
        shell: bash
        run: |
          set -euo pipefail
          node_bin=/usr/local/bin/node
          npm_bin=/usr/local/bin/npm
          if [ ! -x "$node_bin" ] || [ ! -x "$npm_bin" ]; then
            echo "::error::Shared Node.js/npm runtime is missing under /usr/local/bin."
            exit 1
          fi
          if [ "$("$node_bin" -p 'Number(process.versions.node.split(".")[0])')" -lt 22 ]; then
            echo "::error::Shared Node.js runtime must be version 22 or newer."
            exit 1
          fi
          if [ "$DELIVERY_IMPLEMENTER_USER" = "$DELIVERY_AUDITOR_USER" ]; then
            echo "::error::Implementer and auditor Linux users must be different."
            exit 1
          fi
          id "$DELIVERY_AUDITOR_USER" >/dev/null
          auditor_home="${CODEX_AUDITOR_HOME:-$(getent passwd "$DELIVERY_AUDITOR_USER" | cut -d: -f6)/.codex-delivery/auditor}"
          if [ "$CODEX_AUTH_MODE" = "chatgpt" ]; then
            sudo -n -u "$DELIVERY_AUDITOR_USER" -H -- test -r "$auditor_home/auth.json"
          elif [ "$CODEX_AUTH_MODE" = "api-key" ]; then
            test -n "$OPENAI_API_KEY"
          else
            echo "::error::CODEX_AUTH_MODE must be chatgpt or api-key."
            exit 1
          fi
          test -n "$DELIVERY_GITHUB_READ_TOKEN"

      - name: Install trusted runtime dependencies
        run: /usr/local/bin/npm ci --no-audit --no-fund

      - name: Prepare isolated auditor role runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n mkdir -p "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n cp src/role-runtime-worker.mjs src/files.mjs "$DELIVERY_ROLE_RUNTIME_ROOT/"
          sudo -n cp -a node_modules "$DELIVERY_ROLE_RUNTIME_ROOT/node_modules"
          sudo -n chown -R "$DELIVERY_AUDITOR_USER:$DELIVERY_AUDITOR_USER" "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n chmod -R u+rwX,go-rwx "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n -u "$DELIVERY_AUDITOR_USER" -H -- test -r "$DELIVERY_ROLE_RUNTIME_WORKER"

      - name: Run exact-head independent audit
        id: audit
        run: /usr/local/bin/node scripts/run-delivery-v2-independent-audit.mjs

      - name: Publish audit result to PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          AUDIT_RESULT_PATH: ${{ env.AUDIT_RESULT_PATH }}
        with:
          github-token: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}
          script: |
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync(process.env.AUDIT_RESULT_PATH, 'utf8'));
            const result = payload.result;
            const blocking = result.findings.filter((finding) => finding.blocksRelease);
            const body = [
              '<!-- delivery-v2-independent-audit -->',
              '## Delivery V2 independent audit',
              '',
              `- Candidate: \`${result.candidateSha}\``,
              `- Decision: **${result.decision}**`,
              `- Reviewer: \`${result.reviewer.workerIdentity}\` (run ${result.reviewer.runId})`,
              `- Context isolation: \`${result.reviewer.contextIsolation}\``,
              `- Source CI run: ${payload.sourceWorkflowRunId}`,
              `- Audit workflow run: ${payload.auditWorkflowRunId}`,
              `- Request fingerprint: \`${result.requestFingerprint}\``,
              `- Blocking findings: ${blocking.length}`,
              '',
              '```json',
              JSON.stringify(result.findings, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Upload machine-readable audit result
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-independent-audit-${{ needs.resolve.outputs.pr_number }}-${{ github.event.workflow_run.head_sha }}
          path: ${{ env.AUDIT_RESULT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup isolated auditor runtime
        if: always()
        shell: bash
        run: |
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          rm -f "$AUDIT_RESULT_PATH"

  target_audit:
    name: Independent target CRITICAL semantic audit
    needs: resolve
    if: needs.resolve.outputs.should_target_audit == 'true'
    concurrency:
      group: delivery-v2-target-audit-${{ needs.resolve.outputs.target_audit_id }}
      cancel-in-progress: false
    runs-on: [self-hosted, linux, delivery-orchestrator]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TARGET_AUDIT_ID: ${{ needs.resolve.outputs.target_audit_id }}
      AUDIT_RUNTIME_SHA: ${{ needs.resolve.outputs.runtime_sha }}
      AUDIT_RESULT_PATH: /tmp/delivery-v2-target-independent-audit-result-${{ github.run_id }}.json
      DELIVERY_ROLE_RUNTIME_ROOT: /tmp/delivery-v2-target-role-runtime-${{ github.run_id }}
      DELIVERY_ROLE_RUNTIME_WORKER: /tmp/delivery-v2-target-role-runtime-${{ github.run_id }}/role-runtime-worker.mjs
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'chatgpt' }}
      CODEX_AUDITOR_HOME: ${{ vars.CODEX_AUDITOR_HOME }}
      DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
      DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
    steps:
      - name: Checkout pinned target-audit runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.runtime_sha }}
          persist-credentials: false

      - name: Validate isolated target auditor runtime
        shell: bash
        run: |
          set -euo pipefail
          node_bin=/usr/local/bin/node
          npm_bin=/usr/local/bin/npm
          test -x "$node_bin"
          test -x "$npm_bin"
          test "$("$node_bin" -p 'Number(process.versions.node.split(".")[0])')" -ge 22
          test "$DELIVERY_IMPLEMENTER_USER" != "$DELIVERY_AUDITOR_USER"
          test "$(git rev-parse HEAD)" = "$AUDIT_RUNTIME_SHA"
          id "$DELIVERY_AUDITOR_USER" >/dev/null
          auditor_home="${CODEX_AUDITOR_HOME:-$(getent passwd "$DELIVERY_AUDITOR_USER" | cut -d: -f6)/.codex-delivery/auditor}"
          if [ "$CODEX_AUTH_MODE" = "chatgpt" ]; then
            sudo -n -u "$DELIVERY_AUDITOR_USER" -H -- test -r "$auditor_home/auth.json"
          elif [ "$CODEX_AUTH_MODE" = "api-key" ]; then
            test -n "$OPENAI_API_KEY"
          else
            echo "::error::CODEX_AUTH_MODE must be chatgpt or api-key."
            exit 1
          fi
          test -n "$DELIVERY_GITHUB_READ_TOKEN"

      - name: Install trusted target-audit dependencies
        run: /usr/local/bin/npm ci --no-audit --no-fund

      - name: Prepare isolated target auditor role runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n mkdir -p "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n cp src/role-runtime-worker.mjs src/files.mjs "$DELIVERY_ROLE_RUNTIME_ROOT/"
          sudo -n cp -a node_modules "$DELIVERY_ROLE_RUNTIME_ROOT/node_modules"
          sudo -n chown -R "$DELIVERY_AUDITOR_USER:$DELIVERY_AUDITOR_USER" "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n chmod -R u+rwX,go-rwx "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n -u "$DELIVERY_AUDITOR_USER" -H -- test -r "$DELIVERY_ROLE_RUNTIME_WORKER"

      - name: Run configured target independent audit
        id: target_audit
        run: /usr/local/bin/node scripts/run-delivery-v2-target-independent-audit.mjs

      - name: Print target audit decision
        shell: bash
        run: |
          /usr/local/bin/node -e 'const p=require(process.env.AUDIT_RESULT_PATH); console.log(JSON.stringify({targetAuditId:p.targetAuditId,target:p.target,auditAttempt:p.auditAttempt,result:p.result,outcome:p.outcome,auditRuntime:p.auditRuntime,mergePreviewCommitEvidence:p.mergePreviewCommitEvidence,diffEvidence:p.diffEvidence},null,2))'

      - name: Upload machine-readable target audit result
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-target-independent-audit-${{ needs.resolve.outputs.target_audit_id }}-${{ github.run_id }}
          path: ${{ env.AUDIT_RESULT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup isolated target auditor runtime
        if: always()
        shell: bash
        run: |
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          rm -f "$AUDIT_RESULT_PATH"

  persist_target_audit:
    name: Persist durable target audit state
    needs: [resolve, target_audit]
    if: always() && needs.resolve.outputs.should_target_audit == 'true' && needs.target_audit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    outputs:
      comment_id: ${{ steps.persist.outputs.comment_id }}
    steps:
      - name: Download target audit result
        uses: actions/download-artifact@v4
        with:
          name: delivery-v2-target-independent-audit-${{ needs.resolve.outputs.target_audit_id }}-${{ github.run_id }}
          path: /tmp/delivery-v2-target-audit-state

      - name: Persist append-only target audit decision on umbrella issue
        id: persist
        uses: actions/github-script@v7
        env:
          AUDIT_RESULT_PATH: /tmp/delivery-v2-target-audit-state/delivery-v2-target-independent-audit-result-${{ github.run_id }}.json
          TARGET_AUDIT_ID: ${{ needs.resolve.outputs.target_audit_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync(process.env.AUDIT_RESULT_PATH, 'utf8'));
            if (payload.targetAuditId !== process.env.TARGET_AUDIT_ID) {
              core.setFailed('downloaded target audit id does not match resolved target');
              return;
            }
            const result = payload.result;
            const blocking = result.findings.filter((finding) => finding.blocksRelease);
            const state = {
              schemaVersion: 1,
              targetAuditId: payload.targetAuditId,
              candidateSha: result.candidateSha,
              auditWorkflowRunId: payload.auditWorkflowRunId,
              sourceWorkflowRunId: payload.sourceWorkflowRunId,
              decision: result.decision,
              requestFingerprint: result.requestFingerprint,
              runtimeSha: payload.auditRuntime.runtimeSha,
              findings: result.findings,
            };
            const encodedState = Buffer.from(JSON.stringify(state), 'utf8').toString('base64url');
            const stateMarker = `<!-- delivery-v2-target-audit-state:${encodedState} -->`;
            const marker = `<!-- delivery-v2-target-independent-audit:${payload.targetAuditId}:${result.candidateSha}:${payload.auditWorkflowRunId} -->`;
            const candidateMarkerPrefix = `<!-- delivery-v2-target-independent-audit:${payload.targetAuditId}:${result.candidateSha}:`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sourceRunUrl = `https://github.com/${payload.target.repository}/actions/runs/${payload.sourceWorkflowRunId}`;
            const body = [
              marker,
              stateMarker,
              '## Delivery V2 target independent audit',
              '',
              `- Target: \`${payload.target.repository}#${payload.target.pullRequestNumber}\``,
              `- Candidate: \`${result.candidateSha}\``,
              `- Merge preview: \`${payload.target.mergePreviewSha}\``,
              `- Merge commit: \`${payload.target.mergeCommitSha}\``,
              `- Audit attempt: ${payload.auditAttempt}`,
              `- Decision: **${result.decision}**`,
              `- Reviewer: \`${result.reviewer.workerIdentity}\` (run ${result.reviewer.runId})`,
              `- Context isolation: \`${result.reviewer.contextIsolation}\``,
              `- Source CI run: ${payload.sourceWorkflowRunId} (${sourceRunUrl})`,
              `- Source corroboration job: ${payload.sourceWorkflowCorroboration.jobId} / \`${payload.sourceWorkflowCorroboration.jobName}\``,
              `- Source log fingerprint: \`${payload.sourceWorkflowCorroboration.logFingerprint}\``,
              `- GitHub merge-preview evidence: \`${payload.mergePreviewCommitEvidence.fingerprint}\``,
              `- Diff evidence: \`${payload.diffEvidence.diffFingerprint}\` (${payload.diffEvidence.fileCount} files)`,
              `- Audit workflow run: ${payload.auditWorkflowRunId} (${runUrl})`,
              `- Audit runtime SHA: \`${payload.auditRuntime.runtimeSha}\``,
              `- Request fingerprint: \`${result.requestFingerprint}\``,
              `- Blocking findings: ${blocking.length}`,
              '',
              'Runtime fingerprints:',
              '```json',
              JSON.stringify(payload.auditRuntime, null, 2),
              '```',
              '',
              'Findings:',
              '```json',
              JSON.stringify(result.findings, null, 2),
              '```',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 27,
              per_page: 100,
            });
            const exact = comments.filter((comment) => String(comment.body || '').includes(marker));
            if (exact.length > 1) {
              core.setFailed('multiple durable comments already exist for the same target audit workflow run');
              return;
            }
            if (exact.length === 1) {
              const existingBody = String(exact[0].body || '');
              if (!existingBody.includes(stateMarker)) {
                core.setFailed('existing idempotent target audit comment disagrees with the current machine-readable state');
                return;
              }
              core.setOutput('comment_id', String(exact[0].id));
              return;
            }
            const conflictingCandidate = comments.filter((comment) => String(comment.body || '').includes(candidateMarkerPrefix));
            if (conflictingCandidate.length > 0) {
              core.setFailed('durable state already exists for this exact target candidate; append-only policy forbids overwrite or re-audit');
              return;
            }
            const saved = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 27,
              body,
            });
            core.setOutput('comment_id', String(saved.data.id));

  enforce_target_audit:
    name: Enforce target audit decision
    needs: [resolve, target_audit, persist_target_audit]
    if: always() && needs.resolve.outputs.should_target_audit == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify target audit persistence prerequisites
        env:
          TARGET_JOB_RESULT: ${{ needs.target_audit.result }}
          PERSIST_JOB_RESULT: ${{ needs.persist_target_audit.result }}
          DURABLE_COMMENT_ID: ${{ needs.persist_target_audit.outputs.comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_JOB_RESULT" = "success"
          test "$PERSIST_JOB_RESULT" = "success"
          test -n "$DURABLE_COMMENT_ID"

      - name: Download target audit result
        uses: actions/download-artifact@v4
        with:
          name: delivery-v2-target-independent-audit-${{ needs.resolve.outputs.target_audit_id }}-${{ github.run_id }}
          path: /tmp/delivery-v2-target-audit-state

      - name: Enforce target audit decision
        env:
          AUDIT_RESULT_PATH: /tmp/delivery-v2-target-audit-state/delivery-v2-target-independent-audit-result-${{ github.run_id }}.json
          DURABLE_COMMENT_ID: ${{ needs.persist_target_audit.outputs.comment_id }}
        shell: bash
        run: |
          node - <<'NODE'
          const payload = require(process.env.AUDIT_RESULT_PATH);
          const decision = payload?.result?.decision;
          const releaseBlocked = payload?.outcome?.releaseBlocked;
          if (!process.env.DURABLE_COMMENT_ID) {
            console.error('Durable target audit comment is missing.');
            process.exit(1);
          }
          if (decision !== 'approved' || releaseBlocked !== false) {
            console.error(`Target independent audit blocks release: decision=${decision}, releaseBlocked=${releaseBlocked}`);
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: true,
            targetAuditId: payload.targetAuditId,
            candidateSha: payload.result.candidateSha,
            decision,
            releaseBlocked,
            durableCommentId: process.env.DURABLE_COMMENT_ID,
            requestFingerprint: payload.result.requestFingerprint
          }));
          NODE
