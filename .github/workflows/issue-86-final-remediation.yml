name: Issue 86 final remediation
on:
  push:
    branches:
      - feat/86-technical-hygiene-gate
    paths:
      - .github/workflows/issue-86-final-remediation.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/86-technical-hygiene-gate
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Adapt staging script
        run: python3 .github/scripts/issue86-anchor-fix.py
      - name: Apply bounded remediation
        run: python3 .github/scripts/issue86-final-remediation.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused tests
        run: node --test test/v2-operational-controller.test.mjs test/v2-technical-hygiene.test.mjs test/v2-technical-hygiene-release.test.mjs test/v2-gh-aw-hygiene-artifact.test.mjs
      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7
      - name: Compile worker locks officially
        run: gh aw compile --strict
      - name: Full V2 verification
        run: npm run verify:v2
      - name: Build exact validated commit object
        shell: bash
        run: |
          rm .github/workflows/issue-86-final-remediation.yml
          rm .github/scripts/issue86-final-remediation.py
          rm .github/scripts/issue86-anchor-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete technical hygiene operational enforcement (#86)'
          git rev-parse HEAD | tee /tmp/candidate-sha.txt
          git push origin HEAD:refs/heads/feat/86-technical-hygiene-gate || true
      - uses: actions/upload-artifact@v4
        with:
          name: issue86-final-candidate-identity
          path: /tmp/candidate-sha.txt
          retention-days: 1
