name: Delivery V2 - Dispatch

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in owner/repo form
        required: true
        type: string
      target_issue:
        description: Target issue number
        required: true
        type: string
      ai_provider:
        description: AI implementation provider
        required: true
        default: copilot
        type: choice
        options: [copilot, codex, claude]
      risk_profile:
        description: Delivery risk profile
        required: true
        default: auto
        type: choice
        options: [auto, fast, standard, critical]
      base_branch:
        description: Target base branch
        required: true
        default: main
        type: choice
        options: [main, develop]
      changed_paths:
        description: Optional comma/newline-separated expected changed paths; auto mode performs deterministic issue-path discovery when omitted
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: delivery-v2-${{ inputs.target_repository }}-${{ inputs.target_issue }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Bounded deterministic delivery
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_ISSUE: ${{ inputs.target_issue }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DELIVERY_AI_PROVIDER: ${{ inputs.ai_provider }}
      DELIVERY_RISK_PROFILE: ${{ inputs.risk_profile }}
      DELIVERY_CHANGED_PATHS: ${{ inputs.changed_paths }}
      DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
      DELIVERY_GITHUB_WRITE_TOKEN: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      ORCHESTRATOR_WORKER_REF: ${{ github.ref_name }}
      CONTROLLER_RESULT_PATH: /tmp/delivery-v2-controller-${{ github.run_id }}.json
    steps:
      - name: Restrict target repository and base branch
        shell: bash
        run: |
          case "$TARGET_REPOSITORY" in
            crgasparoto-br/*) ;;
            *) echo "Target repository is outside the allowed owner: $TARGET_REPOSITORY" >&2; exit 2 ;;
          esac
          case "$BASE_BRANCH" in
            main|develop) ;;
            *) echo "Unsupported base branch" >&2; exit 2 ;;
          esac

      - name: Checkout deterministic control plane
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard idempotent re-entry
        id: reentry
        run: node scripts/guard-delivery-v2-reentry.mjs

      - name: Build initial deterministic plan
        if: steps.reentry.outputs.run_controller == 'true'
        run: node src/cli.mjs plan-v2 | tee "${RUNNER_TEMP}/delivery-v2-initial-plan.json"

      - name: Run bounded Delivery V2 controller
        if: steps.reentry.outputs.run_controller == 'true'
        run: node scripts/run-delivery-v2-controller.mjs

      - name: Publish controller summary
        if: always()
        shell: bash
        run: |
          if [ -f "$CONTROLLER_RESULT_PATH" ]; then
            {
              echo '## Delivery V2 controller'
              echo '```json'
              cat "$CONTROLLER_RESULT_PATH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-controller-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/delivery-v2-initial-plan.json
            ${{ env.CONTROLLER_RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 30
