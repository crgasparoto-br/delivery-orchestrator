name: Delivery V2 - Dispatch

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in owner/repo form
        required: true
        type: string
      target_issue:
        description: Target issue number
        required: true
        type: string
      risk_profile:
        description: Delivery risk profile
        required: true
        default: auto
        type: choice
        options: [auto, fast, standard, critical]
      base_branch:
        description: Target base branch
        required: true
        default: main
        type: choice
        options: [main, develop]
      changed_paths:
        description: Optional comma/newline-separated expected changed paths; auto mode performs deterministic issue-path discovery when omitted
        required: false
        type: string

run-name: "Delivery V2 controller ${{ inputs.target_repository }} #${{ inputs.target_issue }}"

permissions:
  actions: write
  # `contents: write` lets the controller publish the updated operational Delivery V2 metrics
  # store (docs/delivery-v2/evidence/delivery-v2-metrics.json) back to the orchestrator's
  # default branch, so cross-delivery AI usage/cost history survives the ephemeral runner.
  contents: write

concurrency:
  group: delivery-v2-${{ inputs.target_repository }}-${{ inputs.target_issue }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Bounded deterministic delivery
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_ISSUE: ${{ inputs.target_issue }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      DELIVERY_AI_PROVIDER: ${{ vars.DELIVERY_IMPLEMENTER_PROVIDER || 'copilot' }}
      DELIVERY_IMPLEMENTER_PROVIDER: ${{ vars.DELIVERY_IMPLEMENTER_PROVIDER }}
      DELIVERY_IMPLEMENTER_MODEL: ${{ vars.DELIVERY_IMPLEMENTER_MODEL }}
      DELIVERY_AUDITOR_PROVIDER: ${{ vars.DELIVERY_AUDITOR_PROVIDER }}
      DELIVERY_AUDITOR_MODEL: ${{ vars.DELIVERY_AUDITOR_MODEL }}
      DELIVERY_FAST_IMPLEMENTER_PROVIDER: ${{ vars.DELIVERY_FAST_IMPLEMENTER_PROVIDER }}
      DELIVERY_FAST_IMPLEMENTER_MODEL: ${{ vars.DELIVERY_FAST_IMPLEMENTER_MODEL }}
      DELIVERY_STANDARD_IMPLEMENTER_PROVIDER: ${{ vars.DELIVERY_STANDARD_IMPLEMENTER_PROVIDER }}
      DELIVERY_STANDARD_IMPLEMENTER_MODEL: ${{ vars.DELIVERY_STANDARD_IMPLEMENTER_MODEL }}
      DELIVERY_CRITICAL_IMPLEMENTER_PROVIDER: ${{ vars.DELIVERY_CRITICAL_IMPLEMENTER_PROVIDER }}
      DELIVERY_CRITICAL_IMPLEMENTER_MODEL: ${{ vars.DELIVERY_CRITICAL_IMPLEMENTER_MODEL }}
      DELIVERY_FAST_MAX_AI_CREDITS: ${{ vars.DELIVERY_FAST_MAX_AI_CREDITS || '100' }}
      DELIVERY_FAST_MAX_AI_TURNS: ${{ vars.DELIVERY_FAST_MAX_AI_TURNS || '20' }}
      DELIVERY_FAST_MAX_IMPLEMENTATION_ATTEMPTS: ${{ vars.DELIVERY_FAST_MAX_IMPLEMENTATION_ATTEMPTS || '2' }}
      DELIVERY_STANDARD_MAX_AI_CREDITS: ${{ vars.DELIVERY_STANDARD_MAX_AI_CREDITS || '250' }}
      DELIVERY_STANDARD_MAX_AI_TURNS: ${{ vars.DELIVERY_STANDARD_MAX_AI_TURNS || '40' }}
      DELIVERY_STANDARD_MAX_IMPLEMENTATION_ATTEMPTS: ${{ vars.DELIVERY_STANDARD_MAX_IMPLEMENTATION_ATTEMPTS || '2' }}
      DELIVERY_CRITICAL_MAX_AI_CREDITS: ${{ vars.DELIVERY_CRITICAL_MAX_AI_CREDITS || '500' }}
      DELIVERY_CRITICAL_MAX_AI_TURNS: ${{ vars.DELIVERY_CRITICAL_MAX_AI_TURNS || '80' }}
      DELIVERY_CRITICAL_MAX_IMPLEMENTATION_ATTEMPTS: ${{ vars.DELIVERY_CRITICAL_MAX_IMPLEMENTATION_ATTEMPTS || '3' }}
      DELIVERY_STANDARD_AUDITOR_PROVIDER: ${{ vars.DELIVERY_STANDARD_AUDITOR_PROVIDER }}
      DELIVERY_STANDARD_AUDITOR_MODEL: ${{ vars.DELIVERY_STANDARD_AUDITOR_MODEL }}
      DELIVERY_CRITICAL_AUDITOR_PROVIDER: ${{ vars.DELIVERY_CRITICAL_AUDITOR_PROVIDER }}
      DELIVERY_CRITICAL_AUDITOR_MODEL: ${{ vars.DELIVERY_CRITICAL_AUDITOR_MODEL }}
      DELIVERY_RISK_PROFILE: ${{ inputs.risk_profile }}
      DELIVERY_CHANGED_PATHS: ${{ inputs.changed_paths }}
      DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
      DELIVERY_GITHUB_WRITE_TOKEN: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      ORCHESTRATOR_WORKER_REF: ${{ github.event.repository.default_branch }}
      CONTROLLER_RESULT_PATH: /tmp/delivery-v2-controller-${{ github.run_id }}.json
    steps:
      - name: Restrict target repository and base branch
        shell: bash
        run: |
          case "$TARGET_REPOSITORY" in
            crgasparoto-br/*) ;;
            *) echo "Target repository is outside the allowed owner: $TARGET_REPOSITORY" >&2; exit 2 ;;
          esac
          case "$BASE_BRANCH" in
            main|develop) ;;
            *) echo "Unsupported base branch" >&2; exit 2 ;;
          esac

      - name: Checkout deterministic control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard idempotent re-entry
        id: reentry
        run: node scripts/guard-delivery-v2-reentry.mjs

      - name: Checkout PR branch
        if: steps.reentry.outputs.status == 'legacy-adopted'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ steps.reentry.outputs.adoption_head }}
          path: .delivery-v2-adopted-pr
          token: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reserve initial implementation attempt
        id: reserve
        if: steps.reentry.outputs.run_controller == 'true' && steps.reentry.outputs.resume_pr == '' && steps.reentry.outputs.recover_worker_run_id == ''
        env:
          DELIVERY_V2_PRIOR_INITIAL_ATTEMPTS: ${{ steps.reentry.outputs.prior_initial_attempts }}
          DELIVERY_V2_RECOVERY_REASON: ${{ steps.reentry.outputs.recovery_reason }}
          DELIVERY_V2_RECOVERY_PREVIOUS_ATTEMPTS: ${{ steps.reentry.outputs.recovery_previous_attempts }}
          DELIVERY_V2_RECOVERY_PREVIOUS_CONTROLLER_SHA: ${{ steps.reentry.outputs.recovery_previous_controller_sha }}
          DELIVERY_V2_RECOVERY_CURRENT_CONTROLLER_SHA: ${{ steps.reentry.outputs.recovery_current_controller_sha }}
        run: node scripts/reserve-delivery-v2-initial-attempt.mjs

      - name: Build initial deterministic plan
        if: steps.reentry.outputs.run_controller == 'true' && steps.reentry.outputs.resume_pr == '' && steps.reentry.outputs.recover_worker_run_id == ''
        run: node src/cli.mjs plan-v2 | tee "${RUNNER_TEMP}/delivery-v2-initial-plan.json"

      - name: Run bounded Delivery V2 controller
        if: steps.reentry.outputs.run_controller == 'true'
        env:
          DELIVERY_V2_RESUME_PR: ${{ steps.reentry.outputs.resume_pr }}
          DELIVERY_V2_ADOPTED_CHECKOUT: ${{ github.workspace }}/.delivery-v2-adopted-pr
          DELIVERY_V2_INITIAL_ATTEMPTS: ${{ steps.reserve.outputs.attempts || steps.reentry.outputs.prior_initial_attempts || '1' }}
          DELIVERY_V2_INITIAL_DISPATCH_NONCE: ${{ steps.reserve.outputs.dispatch_nonce || steps.reentry.outputs.dispatch_nonce }}
          DELIVERY_V2_RECOVER_WORKER_RUN_ID: ${{ steps.reentry.outputs.recover_worker_run_id }}
        run: node scripts/run-delivery-v2-controller.mjs

      - name: Persist exhausted initial attempt
        if: failure() && steps.reentry.outputs.run_controller == 'true' && steps.reentry.outputs.resume_pr == ''
        run: node scripts/guard-delivery-v2-reentry.mjs

      - name: Finalize terminal release status
        if: always() && steps.reentry.outputs.run_controller == 'true'
        run: node scripts/finalize-delivery-v2-controller-status.mjs

      - name: Publish controller summary
        if: always()
        shell: bash
        run: |
          if [ -f "$CONTROLLER_RESULT_PATH" ]; then
            {
              echo '## Delivery V2 controller'
              echo '```json'
              cat "$CONTROLLER_RESULT_PATH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The controller wrote the completed delivery into the operational metrics store during the
      # run. Publishing it back to the default branch is what makes the cross-delivery history
      # durable and is the single source `npm run ai:usage` and the AI Usage Report workflow read.
      - name: Publish operational Delivery V2 metrics store
        if: always() && steps.reentry.outputs.run_controller == 'true'
        shell: bash
        env:
          METRICS_STORE: docs/delivery-v2/evidence/delivery-v2-metrics.json
        run: |
          set -euo pipefail
          if [ ! -f "$METRICS_STORE" ]; then
            echo "No operational metrics store produced by this run; nothing to publish."
            exit 0
          fi
          if git diff --quiet -- "$METRICS_STORE"; then
            echo "Operational metrics store unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "delivery-v2-controller"
          git config user.email "delivery-v2-controller@users.noreply.github.com"
          git add "$METRICS_STORE"
          git commit -m "chore(delivery-v2): record delivery metrics for run ${GITHUB_RUN_ID} [skip ci]"
          # Rebase onto any concurrent delivery that published first, then publish.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not publish the operational metrics store after 3 attempts." >&2
          exit 1

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-controller-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/delivery-v2-initial-plan.json
            ${{ env.CONTROLLER_RESULT_PATH }}
            docs/delivery-v2/evidence/delivery-v2-metrics.json
          if-no-files-found: warn
          retention-days: 30
