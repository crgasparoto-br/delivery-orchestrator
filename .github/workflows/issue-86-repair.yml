name: Issue 86 repair

on:
  push:
    branches:
      - feat/86-technical-hygiene-gate

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: stage issue 86 controller repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/86-technical-hygiene-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply controller wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function read(p){return fs.readFileSync(p,'utf8')}
          function write(p,s){fs.writeFileSync(p,s)}
          function once(s,a,b,label){if(!s.includes(a)) throw new Error(`missing anchor: ${label}`); return s.replace(a,b)}

          const hygieneArtifact = `import { execFileSync } from 'node:child_process';
          import { mkdtemp, readFile, readdir, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { evaluateTechnicalHygiene } from './technical-hygiene.mjs';

          function headers(token) {
            return { Accept: 'application/vnd.github+json', Authorization: \`Bearer \${token}\`, 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'delivery-v2-hygiene-artifact' };
          }

          function summaryFromAgentLog(rawLog) {
            const marker = 'TECHNICAL_HYGIENE_JSON=';
            const messages = [];
            for (const line of String(rawLog ?? '').split(/\\r?\\n/)) {
              if (!line.trim().startsWith('{')) continue;
              try {
                const entry = JSON.parse(line);
                if (entry?.type === 'item.completed' && entry?.item?.type === 'agent_message') messages.push(String(entry.item.text ?? ''));
              } catch {}
            }
            for (let index = messages.length - 1; index >= 0; index -= 1) {
              const text = messages[index];
              const at = text.lastIndexOf(marker);
              if (at < 0) continue;
              const payload = text.slice(at + marker.length).split(/\\r?\\n/, 1)[0].trim();
              const parsed = JSON.parse(payload);
              if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw new Error('technical hygiene worker summary must be an object');
              return parsed;
            }
            throw new Error('worker artifact is missing TECHNICAL_HYGIENE_JSON summary');
          }

          async function findFile(root, expected) {
            const stack = [root];
            while (stack.length) {
              const current = stack.pop();
              for (const entry of await readdir(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isDirectory()) stack.push(full);
                else if (entry.name === expected) return full;
              }
            }
            return null;
          }

          export async function downloadGhAwTechnicalHygieneArtifact({ repository, runId, token, baselineSha, materialSha, previousMaterialSha = null, profile } = {}) {
            const list = await fetch(\`https://api.github.com/repos/\${repository}/actions/runs/\${runId}/artifacts?per_page=100\`, { headers: headers(token) });
            if (!list.ok) throw new Error(\`hygiene artifact listing failed: \${list.status}\`);
            const payload = await list.json();
            const artifact = (payload.artifacts ?? []).find((item) => item.name === 'agent');
            if (!artifact) throw new Error('worker agent artifact is missing');
            const download = await fetch(\`https://api.github.com/repos/\${repository}/actions/artifacts/\${artifact.id}/zip\`, { headers: headers(token) });
            if (!download.ok) throw new Error(\`hygiene artifact download failed: \${download.status}\`);
            const root = await mkdtemp(path.join(tmpdir(), 'dv2-hygiene-'));
            try {
              const zip = path.join(root, 'agent.zip');
              await writeFile(zip, Buffer.from(await download.arrayBuffer()));
              execFileSync('unzip', ['-q', zip, '-d', root]);
              const log = await findFile(root, 'agent-stdio.log');
              if (!log) throw new Error('worker agent artifact is missing agent-stdio.log');
              const summary = summaryFromAgentLog(await readFile(log, 'utf8'));
              return evaluateTechnicalHygiene({
                schemaVersion: 1,
                profile,
                baselineSha,
                materialSha,
                previousMaterialSha,
                reuseDiscovery: summary.reuseDiscovery ?? [],
                structuralFindings: summary.structuralFindings ?? [],
                semanticJudgments: summary.semanticJudgments ?? [],
                deterministicReferences: summary.deterministicReferences ?? [],
                missingEvidence: summary.missingEvidence ?? [],
                semanticCalls: summary.semanticCalls ?? 0,
                evidenceRef: artifact.archive_download_url
              });
            } finally {
              await rm(root, { recursive: true, force: true });
            }
          }

          export const __test = Object.freeze({ summaryFromAgentLog });
          `;
          write('src/v2/gh-aw-hygiene-artifact.mjs', hygieneArtifact.replace(/^          /gm,''));

          let shared = read('.github/workflows/shared/delivery-v2-worker-scope-guard.md');
          shared = once(shared,
            'The final worker result must include a compact machine-readable `technical_hygiene` summary bound to the material candidate, listing reuse decisions, created/extended symbols, structural findings, missing evidence and semantic-call count. Allowed principal outcomes are `PASS`, `PASS_WITH_DEBT`, `BLOCK`, and `UNKNOWN`; material `UNKNOWN` is never approval.',
            'The final worker result must include exactly one single-line machine-readable marker `TECHNICAL_HYGIENE_JSON={...}`. The JSON payload must contain `reuseDiscovery`, `structuralFindings`, `semanticJudgments`, `deterministicReferences`, `missingEvidence`, and `semanticCalls`; every material semantic decision must carry reproducible evidence. Do not include authoritative SHAs or a self-declared gate result in this payload: the deterministic controller binds `base_sha`, current `material_sha`, previous remediation SHA and risk profile, then computes `PASS`, `PASS_WITH_DEBT`, `BLOCK`, or `UNKNOWN`. Material `UNKNOWN` is never approval.',
            'worker hygiene marker');
          write('.github/workflows/shared/delivery-v2-worker-scope-guard.md', shared);

          let op = read('src/v2/operational-controller.mjs');
          op = once(op,
            "import { evaluateReleaseGate } from './release-gate.mjs';",
            "import { evaluateReleaseGate } from './release-gate.mjs';\nimport { normalizeTechnicalHygieneResult } from './technical-hygiene.mjs';",
            'operational import');
          op = once(op,
            "  if (materialHeadSha == null) return state;\n  state = startImplementation(state);\n  return publishMaterial(state, { materialHeadSha: requiredSha(materialHeadSha, 'materialHeadSha') });",
            "  if (materialHeadSha == null) return Object.freeze({ ...state, technicalHygiene: null });\n  state = startImplementation(state);\n  state = publishMaterial(state, { materialHeadSha: requiredSha(materialHeadSha, 'materialHeadSha') });\n  return Object.freeze({ ...state, technicalHygiene: null });",
            'create operational hygiene');
          op = once(op,
            "    case 'publish-material': return publishMaterial(state, { materialHeadSha: value.materialHeadSha });\n    case 'ci-result': return recordCiResult(state, value.result);",
            "    case 'publish-material': return Object.freeze({ ...publishMaterial(state, { materialHeadSha: value.materialHeadSha }), technicalHygiene: null });\n    case 'technical-hygiene-result': {\n      const technicalHygiene = normalizeTechnicalHygieneResult(value.result);\n      if (technicalHygiene.materialSha !== state.materialHeadSha) throw new Error('technical hygiene result is stale for material head');\n      return Object.freeze({ ...state, technicalHygiene });\n    }\n    case 'ci-result': return recordCiResult(state, value.result);",
            'hygiene event');
          op = once(op,
            "    case 'head-drift': return recordHeadDrift(state, { materialHeadSha: value.materialHeadSha });",
            "    case 'head-drift': return Object.freeze({ ...recordHeadDrift(state, { materialHeadSha: value.materialHeadSha }), technicalHygiene: null });",
            'head drift hygiene');
          op = once(op,
            "    auditEvidence: persistent.auditEvidence,\n    ciFailure: persistent.ciFailure,",
            "    auditEvidence: persistent.auditEvidence,\n    technicalHygiene: null,\n    ciFailure: persistent.ciFailure,",
            'persistent restore default');
          op = once(op,
            "  const release = evaluateReleaseGate(releaseInput);",
            "  const release = evaluateReleaseGate({ ...releaseInput, technicalHygieneRequired: true, technicalHygiene: current.technicalHygiene ?? null });",
            'release gate wiring');
          write('src/v2/operational-controller.mjs', op);

          let run = read('scripts/run-delivery-v2-controller.mjs');
          run = once(run,
            "import { normalizeGhAwUsage, parseGhAwUsageJsonl } from '../src/v2/usage-telemetry.mjs';",
            "import { normalizeGhAwUsage, parseGhAwUsageJsonl } from '../src/v2/usage-telemetry.mjs';\nimport { downloadGhAwTechnicalHygieneArtifact } from '../src/v2/gh-aw-hygiene-artifact.mjs';",
            'run hygiene import');
          run = once(run,
            "  let lastAudit = null;\n\n  let controller =",
            "  let lastAudit = null;\n  const initialTechnicalHygiene = await downloadGhAwTechnicalHygieneArtifact({ repository: orchestratorRepository, runId: worker.id, token: actionsToken, baselineSha: expectedBaseSha, materialSha: materialHeadSha, previousMaterialSha: null, profile: state.riskProfile });\n  state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: initialTechnicalHygiene });\n  evidenceRefs.push(initialTechnicalHygiene.evidenceRef);\n\n  let controller =",
            'initial hygiene collection');
          run = once(run,
            "  await persist({ nextAction: 'observe-ci', workerRunId: worker.id, workerDispatchNonce: initialDispatchNonce, materialWorkerRunId: worker.id, materialWorkerIdentity: initialWorkerIdentity, materialWorkerProvider: initialWorkerProvider });",
            "  await persist({ nextAction: 'observe-ci', workerRunId: worker.id, workerDispatchNonce: initialDispatchNonce, materialWorkerRunId: worker.id, materialWorkerIdentity: initialWorkerIdentity, materialWorkerProvider: initialWorkerProvider, technicalHygiene: state.technicalHygiene });",
            'initial hygiene persist');
          run = once(run,
            "      state = applyOperationalEvent(state, { type: 'head-drift', materialHeadSha });",
            "      state = applyOperationalEvent(state, { type: 'head-drift', materialHeadSha });",
            'head drift anchor');
          run = once(run,
            "      await persist({ nextAction: 'external-head-drift-requires-controller-resume' });",
            "      await persist({ nextAction: 'external-head-drift-requires-controller-resume', technicalHygiene: null });",
            'head drift persist');
          const remediationAnchor = "      state = applyOperationalEvent(state, { type: 'publish-material', materialHeadSha });\n      latestCheck = null;\n      latestSourceRun = null;";
          const remediationReplacement = "      state = applyOperationalEvent(state, { type: 'publish-material', materialHeadSha });\n      const remediationTechnicalHygiene = await downloadGhAwTechnicalHygieneArtifact({ repository: orchestratorRepository, runId: worker.id, token: actionsToken, baselineSha: expectedBaseSha, materialSha: materialHeadSha, previousMaterialSha: beforeSha, profile: state.riskProfile });\n      state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: remediationTechnicalHygiene });\n      evidenceRefs.push(remediationTechnicalHygiene.evidenceRef);\n      latestCheck = null;\n      latestSourceRun = null;";
          let count = 0;
          while (run.includes(remediationAnchor)) { run = run.replace(remediationAnchor, remediationReplacement); count += 1; }
          if (count !== 2) throw new Error(`expected 2 remediation hygiene anchors, found ${count}`);
          run = run.replaceAll("materialWorkerProvider: plan.implementation.provider });", "materialWorkerProvider: plan.implementation.provider, technicalHygiene: state.technicalHygiene });");
          write('scripts/run-delivery-v2-controller.mjs', run);

          let resume = read('scripts/resume-delivery-v2-controller.mjs');
          resume = once(resume,
            "import { downloadGhAwUsageArtifact } from '../src/v2/gh-aw-usage-artifact.mjs';",
            "import { downloadGhAwUsageArtifact } from '../src/v2/gh-aw-usage-artifact.mjs';\nimport { downloadGhAwTechnicalHygieneArtifact } from '../src/v2/gh-aw-hygiene-artifact.mjs';",
            'resume hygiene import');
          resume = once(resume,
            "    state = operationalStateFromPersistent(reconciled.state);\n    if (reconciled.staleStateDetected",
            "    state = operationalStateFromPersistent(reconciled.state);\n    if (!reconciled.staleStateDetected && stateEnvelope.controller?.technicalHygiene) {\n      state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: stateEnvelope.controller.technicalHygiene });\n    }\n    if (reconciled.staleStateDetected",
            'resume restore hygiene');
          resume = once(resume,
            "        ...(materialIdentityStale ? { materialWorkerRunId: null, materialWorkerIdentity: null, materialWorkerProvider: null } : {})",
            "        technicalHygiene: materialIdentityStale ? null : controller.technicalHygiene ?? null,\n        ...(materialIdentityStale ? { materialWorkerRunId: null, materialWorkerIdentity: null, materialWorkerProvider: null } : {})",
            'resume stale hygiene');
          resume = once(resume,
            "      state = applyOperationalEvent(state, { type: 'publish-material', materialHeadSha });\n      latestCheck = null;\n      latestSourceRun = null;\n      await persist({ nextAction: 'observe-ci', ...controllerMetadataForNewMaterial({ controller, workerRunId: run.id, plan }) });",
            "      state = applyOperationalEvent(state, { type: 'publish-material', materialHeadSha });\n      const technicalHygiene = await downloadGhAwTechnicalHygieneArtifact({ repository: orchestratorRepository, runId: run.id, token: actionsToken, baselineSha: expectedBaseSha, materialSha: materialHeadSha, previousMaterialSha: beforeSha, profile: state.riskProfile });\n      state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: technicalHygiene });\n      latestCheck = null;\n      latestSourceRun = null;\n      await persist({ nextAction: 'observe-ci', ...controllerMetadataForNewMaterial({ controller, workerRunId: run.id, plan }), technicalHygiene: state.technicalHygiene });",
            'resume completed remediation hygiene');
          resume = once(resume,
            "        await persist({ nextAction: 'observe-ci', reason: 'reconciled-head-drift' });",
            "        await persist({ nextAction: 'observe-ci', reason: 'reconciled-head-drift', technicalHygiene: null });",
            'resume drift clear');
          write('scripts/resume-delivery-v2-controller.mjs', resume);

          let opt = read('test/v2-operational-controller.test.mjs');
          opt += `\n\ntest('operational release fails closed until exact-head technical hygiene is attached', () => {\n  let state = createOperationalDelivery({ plan: planFor('fast'), materialHeadSha: A });\n  state = applyOperationalEvent(state, { type: 'ci-result', result: { candidateSha: A, conclusion: 'success', evidenceRef: 'run:ok' } });\n  const releaseInput = { schemaVersion: 1, repository: 'owner/repo', pullRequestNumber: 77, materialHeadSha: A, currentRemoteHeadSha: A, evidenceCollection: { materialHeadSha: A, remoteHeadSha: A, evidenceRef: 'collection' }, classifier: { subjectSha: A, profile: 'fast', version: 'v1', fingerprint: 'x', expectedFingerprint: 'x', evidenceRef: 'classifier' }, checks: [{ name: 'ci', required: true, subjectSha: A, status: 'completed', conclusion: 'success', workflowRunId: 1, evidenceRef: 'ci' }], standardAuditRequired: false, unresolvedFindings: [], blockers: [] };\n  let release = evaluateOperationalRelease({ state, releaseInput });\n  assert.equal(release.readiness, false);\n  assert.deepEqual(release.reasons, ['technical-hygiene-missing']);\n  state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: { schemaVersion: 1, baselineSha: B, materialSha: A, previousMaterialSha: null, result: 'PASS', effectiveProfile: 'fast', promotionRequired: false, missingEvidence: [], evidenceRef: 'artifact:hygiene' } });\n  release = evaluateOperationalRelease({ state, releaseInput });\n  assert.equal(release.readiness, true);\n});\n\ntest('new material invalidates prior technical hygiene approval', () => {\n  let state = createOperationalDelivery({ plan: planFor('fast'), materialHeadSha: A });\n  state = applyOperationalEvent(state, { type: 'technical-hygiene-result', result: { schemaVersion: 1, baselineSha: B, materialSha: A, previousMaterialSha: null, result: 'PASS', effectiveProfile: 'fast', promotionRequired: false, missingEvidence: [], evidenceRef: 'artifact:hygiene' } });\n  state = applyOperationalEvent(state, { type: 'start-implementation' });\n  state = applyOperationalEvent(state, { type: 'publish-material', materialHeadSha: B });\n  assert.equal(state.technicalHygiene, null);\n});\n`;
          write('test/v2-operational-controller.test.mjs', opt);

          const artifactTest = `import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { __test } from '../src/v2/gh-aw-hygiene-artifact.mjs';\n\ntest('extracts the final single-line technical hygiene marker from agent log', () => {\n  const payload = { reuseDiscovery: [{ symbol: 'x', decision: 'REUSE_EXISTING', evidence: ['path:x'] }], structuralFindings: [], semanticJudgments: [], deterministicReferences: [], missingEvidence: [], semanticCalls: 0 };\n  const log = JSON.stringify({ type: 'item.completed', item: { type: 'agent_message', text: `done\\nTECHNICAL_HYGIENE_JSON=${JSON.stringify(payload)}` } });\n  assert.deepEqual(__test.summaryFromAgentLog(log), payload);\n});\n\ntest('missing technical hygiene marker fails closed', () => {\n  const log = JSON.stringify({ type: 'item.completed', item: { type: 'agent_message', text: 'done' } });\n  assert.throws(() => __test.summaryFromAgentLog(log), /missing TECHNICAL_HYGIENE_JSON/);\n});\n`;
          write('test/v2-gh-aw-hygiene-artifact.test.mjs', artifactTest);
          NODE
      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7
      - name: Compile workers
        run: gh aw compile --strict
      - name: Run verification
        run: npm run verify:v2
      - name: Remove staging workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/issue-86-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: wire technical hygiene into operational release'
          git push origin HEAD:feat/86-technical-hygiene-gate
