# r5 validated transport retry 2
name: Delivery V2 R5 transport

on:
  push:
    branches:
      - feat/63-v2-operational-efficiency
    paths:
      - '.github/workflows/delivery-v2-r5-transport.yml'

permissions:
  contents: write

jobs:
  build-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply systemic remediation
        run: |
          node scripts/delivery-v2-r5-fix-patcher.mjs
          node scripts/delivery-v2-r5-patch.mjs
      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7
      - name: Compile workers
        run: gh aw compile --strict
      - name: Validate remediation
        run: |
          node --check src/v2/ci-evidence-correlation.mjs
          node --check src/v2/controller-runtime.mjs
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/resume-delivery-v2-controller.mjs
          node --test test/v2-ci-evidence-correlation.test.mjs test/v2-controller-runtime.test.mjs test/v2-worker-contract.test.mjs test/v2-operational-efficiency.test.mjs
          npm run verify:v2:complete
      - name: Publish validated payload
        shell: bash
        run: |
          set -euo pipefail
          root=.delivery-v2-r5-payload
          rm -rf "$root"
          mkdir -p "$root"
          files=(
            .github/workflows/delivery-v2-dispatch.yml
            scripts/run-delivery-v2-controller.mjs
            scripts/resume-delivery-v2-controller.mjs
            src/v2/ci-evidence-correlation.mjs
            src/v2/controller-runtime.mjs
            test/v2-ci-evidence-correlation.test.mjs
            test/v2-controller-runtime.test.mjs
          )
          for f in .github/workflows/delivery-v2-worker-*.md .github/workflows/delivery-v2-worker-*.lock.yml; do files+=("$f"); done
          for f in "${files[@]}"; do
            mkdir -p "$root/$(dirname "$f")"
            cp "$f" "$root/$f"
          done
          git reset --hard HEAD
          git clean -fd -e "$root"
          git add "$root"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(v2): publish validated r5 remediation payload'
          git push origin HEAD:${{ github.ref_name }}
