name: Independent delivery loop
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Delivery {0}#{1}', inputs.target_repository, inputs.issue_number) || github.event.issue.title }}

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repo to implement
        required: true
        type: string
      issue_number:
        description: GitHub issue number
        required: true
        type: string
      max_cycles:
        description: Maximum implement/audit cycles
        required: false
        default: '6'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

# ChatGPT-managed Codex auth refreshes auth.json in place. Keep one serialized
# workflow stream while each role runs under a distinct Linux identity.
concurrency:
  group: delivery-orchestrator
  cancel-in-progress: false

jobs:
  delivery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'delivery-request:'))
    runs-on: [self-hosted, linux, delivery-orchestrator]
    timeout-minutes: 360
    env:
      DELIVERY_RUNTIME_ROOT: /tmp/delivery-orchestrator-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize delivery request
        id: request
        env:
          MANUAL_TARGET_REPOSITORY: ${{ inputs.target_repository }}
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MANUAL_MAX_CYCLES: ${{ inputs.max_cycles }}
          DELIVERY_REQUEST_ACTORS: ${{ vars.DELIVERY_REQUEST_ACTORS }}
          DELIVERY_ALLOWED_REPOSITORIES: ${{ vars.DELIVERY_ALLOWED_REPOSITORIES }}
          DELIVERY_REQUEST_MAX_CYCLES: ${{ vars.DELIVERY_REQUEST_MAX_CYCLES || '12' }}
        run: node scripts/normalize-delivery-request.mjs
      - name: Install orchestrator dependencies
        run: npm install --no-audit --no-fund
      - name: Validate bundle
        run: npm run validate
      - name: Prepare shared role runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$DELIVERY_RUNTIME_ROOT"
          install -d -m 755 "$DELIVERY_RUNTIME_ROOT"
          cp -a src skills prompts schemas trust node_modules package.json "$DELIVERY_RUNTIME_ROOT"/

          python3 -m venv "$DELIVERY_RUNTIME_ROOT/.venv"
          "$DELIVERY_RUNTIME_ROOT/.venv/bin/python" -m pip install --upgrade pip
          "$DELIVERY_RUNTIME_ROOT/.venv/bin/python" -m pip install \
            -r "$DELIVERY_RUNTIME_ROOT/skills/catalog/entregar-issue/requirements.txt" \
            -r "$DELIVERY_RUNTIME_ROOT/skills/catalog/auditar-issue/requirements.txt"

          chmod -R a+rX "$DELIVERY_RUNTIME_ROOT"
          chmod -R go-w "$DELIVERY_RUNTIME_ROOT"
      - name: Validate isolated Codex role runtime
        shell: bash
        env:
          CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'chatgpt' }}
          CODEX_IMPLEMENTER_HOME: ${{ vars.CODEX_IMPLEMENTER_HOME }}
          CODEX_AUDITOR_HOME: ${{ vars.CODEX_AUDITOR_HOME }}
          DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
          DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
        run: |
          set -euo pipefail
          implementer_user="$DELIVERY_IMPLEMENTER_USER"
          auditor_user="$DELIVERY_AUDITOR_USER"
          node_bin="/usr/local/bin/node"
          worker="$DELIVERY_RUNTIME_ROOT/src/role-runtime-worker.mjs"

          if [ ! -x "$node_bin" ]; then
            echo "::error::Shared Node.js runtime is missing at $node_bin. Install Node.js >=22 in /usr/local/bin."
            exit 1
          fi
          node_major="$("$node_bin" -p 'Number(process.versions.node.split(".")[0])')"
          if [ "$node_major" -lt 22 ]; then
            echo "::error::Shared Node.js runtime at $node_bin must be version 22 or newer."
            exit 1
          fi
          if [ "$implementer_user" = "$auditor_user" ]; then
            echo "::error::Implementer and auditor Linux users must be different."
            exit 1
          fi
          for role_user in "$implementer_user" "$auditor_user"; do
            if ! id "$role_user" >/dev/null 2>&1; then
              echo "::error::Missing dedicated Linux role user: $role_user"
              exit 1
            fi
            if ! printf '%s\n' '{"path":"/dev/null"}' | sudo -n -u "$role_user" -H -- "$node_bin" "$worker" probe-readable >/dev/null; then
              echo "::error::Runner cannot execute the shared role worker as $role_user without interaction."
              exit 1
            fi
          done

          if [ "$CODEX_AUTH_MODE" = "chatgpt" ]; then
            if [ "${{ github.event.repository.private }}" != "true" ]; then
              echo "::error::ChatGPT-managed Codex auth is restricted to trusted private automation. Make this control repository private or set CODEX_AUTH_MODE=api-key."
              exit 1
            fi
            implementer_os_home="$(getent passwd "$implementer_user" | cut -d: -f6)"
            auditor_os_home="$(getent passwd "$auditor_user" | cut -d: -f6)"
            implementer_home="${CODEX_IMPLEMENTER_HOME:-$implementer_os_home/.codex-delivery/implementer}"
            auditor_home="${CODEX_AUDITOR_HOME:-$auditor_os_home/.codex-delivery/auditor}"
            if [ "$implementer_home" = "$auditor_home" ]; then
              echo "::error::Implementer and auditor CODEX_HOME paths must be different."
              exit 1
            fi
            if ! sudo -n -u "$implementer_user" -H -- test -r "$implementer_home/auth.json"; then
              echo "::error::Implementer ChatGPT auth cache is missing or unreadable by its role user."
              exit 1
            fi
            if ! sudo -n -u "$auditor_user" -H -- test -r "$auditor_home/auth.json"; then
              echo "::error::Auditor ChatGPT auth cache is missing or unreadable by its role user."
              exit 1
            fi
            if sudo -n -u "$implementer_user" -H -- test -r "$auditor_home/auth.json"; then
              echo "::error::Cross-role credential read: implementer can read auditor auth.json."
              exit 1
            fi
            if sudo -n -u "$auditor_user" -H -- test -r "$implementer_home/auth.json"; then
              echo "::error::Cross-role credential read: auditor can read implementer auth.json."
              exit 1
            fi
            sudo -n -u "$implementer_user" -H -- chmod 600 "$implementer_home/auth.json"
            sudo -n -u "$auditor_user" -H -- chmod 600 "$auditor_home/auth.json"
            sudo -n -u "$implementer_user" -H -- "$node_bin" -e 'const fs=require("node:fs"); const f=process.argv[1]; const a=JSON.parse(fs.readFileSync(f,"utf8")); if(a.auth_mode!=="chatgpt" || !a.tokens?.refresh_token){ process.exit(1); }' "$implementer_home/auth.json"
            sudo -n -u "$auditor_user" -H -- "$node_bin" -e 'const fs=require("node:fs"); const f=process.argv[1]; const a=JSON.parse(fs.readFileSync(f,"utf8")); if(a.auth_mode!=="chatgpt" || !a.tokens?.refresh_token){ process.exit(1); }' "$auditor_home/auth.json"
          elif [ "$CODEX_AUTH_MODE" != "api-key" ]; then
            echo "::error::CODEX_AUTH_MODE must be chatgpt or api-key."
            exit 1
          fi
      - name: Run independent delivery loop
        env:
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          TARGET_ISSUE: ${{ steps.request.outputs.issue_number }}
          MAX_CYCLES: ${{ steps.request.outputs.max_cycles }}
          MAX_STAGNANT_CYCLES: '1'
          CI_WAIT_TIMEOUT_SECONDS: '2700'
          CI_DISCOVERY_GRACE_SECONDS: '30'
          CI_POLL_INTERVAL_SECONDS: '15'
          CI_SETTLE_SECONDS: '15'
          CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'chatgpt' }}
          CODEX_IMPLEMENTER_HOME: ${{ vars.CODEX_IMPLEMENTER_HOME }}
          CODEX_AUDITOR_HOME: ${{ vars.CODEX_AUDITOR_HOME }}
          DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
          DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
          CODEX_SANDBOX_MODE: ${{ vars.CODEX_SANDBOX_MODE || 'workspace-write' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          DELIVERY_GITHUB_WRITE_TOKEN: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}
          DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
          AUDITOR_PRIVATE_KEY_B64: ${{ secrets.AUDITOR_PRIVATE_KEY_B64 }}
          AUDITOR_KEY_PASSWORD: ${{ secrets.AUDITOR_KEY_PASSWORD }}
          AUDITOR_KEY_ID: ${{ vars.AUDITOR_KEY_ID }}
          TRUSTED_AUDITORS_PATH: ${{ vars.TRUSTED_AUDITORS_PATH }}
          RUNS_ROOT: ${{ env.DELIVERY_RUNTIME_ROOT }}/runs
          SKILL_CATALOG: ${{ env.DELIVERY_RUNTIME_ROOT }}/skills/catalog
          PATH: ${{ env.DELIVERY_RUNTIME_ROOT }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        shell: bash
        run: |
          set -euo pipefail
          cd "$DELIVERY_RUNTIME_ROOT"
          /usr/local/bin/node src/cli.mjs run
      - name: Remove ephemeral role workspaces and secrets
        if: always()
        shell: bash
        env:
          DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
          DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
        run: |
          set -euo pipefail
          for role_user in "$DELIVERY_IMPLEMENTER_USER" "$DELIVERY_AUDITOR_USER"; do
            if id "$role_user" >/dev/null 2>&1; then
              sudo -n -u "$role_user" -H -- find /tmp -maxdepth 1 -type d -user "$role_user" -name 'delivery-orchestrator-*' -exec rm -rf -- {} + || true
            fi
          done
      - name: Upload forensic run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-orchestrator-run-${{ github.run_id }}
          path: ${{ env.DELIVERY_RUNTIME_ROOT }}/runs/
          if-no-files-found: warn
      - name: Remove shared orchestration runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$DELIVERY_RUNTIME_ROOT" in
            /tmp/delivery-orchestrator-runtime-*) rm -rf -- "$DELIVERY_RUNTIME_ROOT" ;;
            *) echo "::error::Refusing to remove unexpected runtime path: $DELIVERY_RUNTIME_ROOT"; exit 1 ;;
          esac
