name: Delivery V2 - Compile gh-aw

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/delivery-v2-worker-*.md'
      - '.github/workflows/delivery-v2-worker-*.lock.yml'
      - '.github/workflows/delivery-v2-gh-aw-compile.yml'
      - '.github/aw/actions-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-v2-gh-aw-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile provider workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Compile workers in strict mode
        run: gh aw compile --strict

      - name: Verify canonical locks are synchronized
        shell: bash
        run: git diff --exit-code -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
