name: Delivery V2 - Compile gh-aw

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/delivery-v2-worker-*.md'
      - '.github/workflows/delivery-v2-gh-aw-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delivery-v2-gh-aw-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile provider workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Compile workers in strict mode
        run: gh aw compile --strict

      - name: Stage compiled locks outside workflow namespace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/delivery-v2-compiled-locks
          mkdir -p .tmp/delivery-v2-compiled-locks
          cp .github/workflows/delivery-v2-worker-*.lock.yml .tmp/delivery-v2-compiled-locks/
          cp .github/aw/actions-lock.json .tmp/delivery-v2-compiled-locks/actions-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/delivery-v2-compiled-locks
          git commit -m "chore: stage compiled Delivery V2 locks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
