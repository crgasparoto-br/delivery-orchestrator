name: Delivery V2 - Compile gh-aw

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/delivery-v2-worker-*.md'
      - '.github/workflows/delivery-v2-gh-aw-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delivery-v2-gh-aw-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile provider workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Compile and publish canonical locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            gh aw compile --strict
            git add .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
            if git diff --cached --quiet; then
              echo "Compiled worker locks already current."
              exit 0
            fi

            git commit -m "chore: compile Delivery V2 workers"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Remote head moved while publishing compiled locks; recompiling from the latest branch head (attempt ${attempt}/3)."
          done

          echo "Could not publish compiled worker locks after three fresh-head attempts." >&2
          exit 1
