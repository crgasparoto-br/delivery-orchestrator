name: Delivery V2 - Plan

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository in owner/repo form
        required: true
        type: string
      target_issue:
        description: Issue number
        required: true
        type: string
      ai_provider:
        description: AI implementation provider
        required: true
        default: copilot
        type: choice
        options:
          - copilot
          - codex
          - claude
      risk_profile:
        description: Requested delivery risk profile
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast
          - standard
          - critical
      changed_paths:
        description: Optional comma/newline separated changed paths for deterministic risk promotion
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Build deterministic V2 plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_ISSUE: ${{ inputs.target_issue }}
      DELIVERY_AI_PROVIDER: ${{ inputs.ai_provider }}
      DELIVERY_RISK_PROFILE: ${{ inputs.risk_profile }}
      DELIVERY_CHANGED_PATHS: ${{ inputs.changed_paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build V2 plan
        run: |
          node src/cli.mjs plan-v2 | tee delivery-v2-plan.json
          {
            echo '## Delivery V2 plan'
            echo '```json'
            cat delivery-v2-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V2 plan
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-plan-${{ github.run_id }}
          path: delivery-v2-plan.json
          if-no-files-found: error
          retention-days: 7
