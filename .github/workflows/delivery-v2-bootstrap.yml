name: Delivery V2 - Branch Bootstrap

on:
  push:
    branches:
      - feat/63-v2-operational-efficiency
    paths:
      - '.delivery-v2-bootstrap/**'
      - '.github/workflows/delivery-v2-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: delivery-v2-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Materialize V2.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery-v2-bootstrap/part-* > /tmp/delivery-v2-bootstrap.b64
          base64 -d /tmp/delivery-v2-bootstrap.b64 > /tmp/delivery-v2-bootstrap.tar.gz
          tar -xzf /tmp/delivery-v2-bootstrap.tar.gz -C .
          rm -rf .delivery-v2-bootstrap .github/workflows/delivery-v2-bootstrap.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused Delivery V2 validation
        run: |
          node --test test/v2-*.test.mjs
          npm run validate
          npm run verify:v2:complete
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/run-delivery-v2-github-audit.mjs
          node --check scripts/normalize-gh-aw-usage.mjs
          for file in src/v2/*.mjs; do node --check "$file"; done

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Compile canonical workers once
        run: gh aw compile --strict

      - name: Re-run worker contract against compiled locks
        run: node --test test/v2-worker-contract.test.mjs

      - name: Publish one cohesive material commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No material changes produced'; exit 1; }
          git commit -m 'feat(v2): wire bounded operational controller'
          git push origin HEAD:${{ github.ref_name }}
