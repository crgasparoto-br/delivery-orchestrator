name: Delivery V2 R3 Remediation

on:
  push:
    branches:
      - feat/63-v2-operational-efficiency
    paths:
      - '.github/workflows/delivery-v2-r3-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/63-v2-operational-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Recover and apply systemic remediation program
        shell: bash
        run: |
          git show b0cde7559e26d2b05b001b1b42dc3a6949b7fbea:.github/workflows/delivery-v2-r3-remediation.yml > /tmp/dv2-r3-old.yml
          start="$(grep -n "node <<'NODE'" /tmp/dv2-r3-old.yml | head -1 | cut -d: -f1)"
          end="$(grep -n '^          NODE$' /tmp/dv2-r3-old.yml | head -1 | cut -d: -f1)"
          test -n "$start" -a -n "$end" -a "$end" -gt "$start"
          sed -n "$((start + 1)),$((end - 1))p" /tmp/dv2-r3-old.yml | sed 's/^          //' > /tmp/dv2-r3-remediate.cjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/dv2-r3-remediate.cjs')
          text = path.read_text()
          lines = text.splitlines()
          replacement = r"const body = marker + '\\n\\n' + String.fromCharCode(96).repeat(3) + 'json\\n{\"ok\":true}\\n' + String.fromCharCode(96).repeat(3);"
          found = False
          for index, line in enumerate(lines):
              if line.startswith('const body = marker + '):
                  lines[index] = replacement
                  found = True
          if not found:
              raise SystemExit('controller provenance test body anchor not found')
          text = '\n'.join(lines) + '\n'
          marker = '// Resume controller validates persisted comment + workflow provenance and preserves current controller lineage.'
          before, sep, after = text.partition(marker)
          if not sep:
              raise SystemExit('resume patch section not found')
          old = "`      const releaseIdentity = releaseIdentityFromPullRequest(finalPullRequest, { materialHeadSha, baseSha: expectedBaseSha });\\n      const releaseInput = {\\n`"
          new = "`    const releaseIdentity = releaseIdentityFromPullRequest(finalPullRequest, { materialHeadSha, baseSha: expectedBaseSha });\\n    const releaseInput = {\\n`"
          old_replacement = "`      const releaseIdentity = releaseIdentityFromPullRequest(finalPullRequest, { materialHeadSha, baseSha: expectedBaseSha });\\n      const mergePreview = await collectMergePreviewEvidence({ repository: targetRepository, pullRequest: finalPullRequest, materialHeadSha, baseSha: expectedBaseSha, workflowRun: latestSourceRun, requiredJobName: targetPolicy.mergePreviewJobName, token: targetReadToken });\\n      const releaseInput = {\\n`"
          new_replacement = "`    const releaseIdentity = releaseIdentityFromPullRequest(finalPullRequest, { materialHeadSha, baseSha: expectedBaseSha });\\n    const mergePreview = await collectMergePreviewEvidence({ repository: targetRepository, pullRequest: finalPullRequest, materialHeadSha, baseSha: expectedBaseSha, workflowRun: latestSourceRun, requiredJobName: targetPolicy.mergePreviewJobName, token: targetReadToken });\\n    const releaseInput = {\\n`"
          if old not in after or old_replacement not in after:
              raise SystemExit('resume release anchor rewrite inputs not found')
          after = after.replace(old, new, 1).replace(old_replacement, new_replacement, 1)
          path.write_text(before + sep + after)
          PY
          test -s /tmp/dv2-r3-remediate.cjs
          node --check /tmp/dv2-r3-remediate.cjs
          node /tmp/dv2-r3-remediate.cjs
      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7
      - name: Compile workers
        run: gh aw compile --strict
      - name: Validate remediated candidate
        run: |
          node --check src/v2/controller-provenance.mjs
          node --check src/v2/controller-runtime.mjs
          node --check src/v2/persistent-state.mjs
          node --check src/v2/operational-controller.mjs
          node --check scripts/guard-delivery-v2-reentry.mjs
          node --check scripts/reserve-delivery-v2-initial-attempt.mjs
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/resume-delivery-v2-controller.mjs
          node --test test/v2-controller-provenance.test.mjs test/v2-controller-runtime.test.mjs test/v2-persistent-state.test.mjs test/v2-operational-controller.test.mjs test/v2-reentry-guard.test.mjs test/v2-remediation-state-machine.test.mjs test/v2-worker-contract.test.mjs
          npm run verify:v2
          npm run verify:v2:complete
      - name: Publish clean functional candidate
        shell: bash
        run: |
          git rm .github/workflows/delivery-v2-r3-remediation.yml
          git config user.name "delivery-v2-remediation"
          git config user.email "delivery-v2-remediation@users.noreply.github.com"
          git add src/v2 scripts test config .github/workflows .github/aw
          git commit -m "fix(v2): close systemic release and resume audit gaps"
          git push origin HEAD:feat/63-v2-operational-efficiency
