name: Delivery V2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: delivery-v2-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation:
    name: V2 platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch for bounded remediation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Assemble and apply cumulative Delivery V2 audit remediations
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.v2-remediation-part-* > scripts/apply-v2-finalize-remediation.mjs
          node --check scripts/apply-v2-finalize-remediation.mjs
          node scripts/apply-v2-finalize-remediation.mjs

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Regenerate canonical worker locks
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --strict
          git add .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json

      - name: Restore trusted CI and remove remediation transport
        shell: bash
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/delivery-v2-ci.yml" > .github/workflows/delivery-v2-ci.yml
          rm -f scripts/apply-v2-finalize-remediation.mjs scripts/.v2-remediation-part-*
          node -e "const fs=require('fs'); for (const f of ['scripts/run-delivery-v2-controller.mjs','scripts/resume-delivery-v2-controller.mjs']) { const s=fs.readFileSync(f,'utf8'); fs.writeFileSync(f,s.replace(/\n+$/,'\n')); }"

      - name: Validate final candidate before publication
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v2/controller-runtime.mjs
          node --check scripts/guard-delivery-v2-reentry.mjs
          node --check scripts/reserve-delivery-v2-initial-attempt.mjs
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/resume-delivery-v2-controller.mjs
          node --test test/v2-*.test.mjs
          npm run validate
          npm run verify:v2
          npm run verify:v2:complete
          gh aw compile --strict
          git diff --exit-code -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
          git diff --check

      - name: Publish one cohesive remediation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "delivery-v2-remediator"
          git config user.email "delivery-v2-remediator@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation diff was produced" >&2
            exit 2
          fi
          git commit -m "fix(v2): close cumulative audit escape controls"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
