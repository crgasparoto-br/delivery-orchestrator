name: Delivery V2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: write

concurrency:
  group: delivery-v2-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation:
    name: V2 platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch for bounded remediation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Assemble and apply cumulative Delivery V2 audit remediations
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.v2-remediation-part-* > scripts/apply-v2-finalize-remediation.mjs
          node --check scripts/apply-v2-finalize-remediation.mjs
          node scripts/apply-v2-finalize-remediation.mjs

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Regenerate canonical worker locks
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --strict
          git add .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json

      - name: Restore trusted CI and remove remediation transport
        shell: bash
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/delivery-v2-ci.yml" > .github/workflows/delivery-v2-ci.yml
          rm -f scripts/apply-v2-finalize-remediation.mjs scripts/.v2-remediation-part-*
          node -e "const fs=require('fs'); for (const f of ['scripts/run-delivery-v2-controller.mjs','scripts/resume-delivery-v2-controller.mjs']) { const s=fs.readFileSync(f,'utf8'); fs.writeFileSync(f,s.replace(/\n+$/,'\n')); }"

      - name: Validate final candidate before publication
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v2/controller-runtime.mjs
          node --check scripts/guard-delivery-v2-reentry.mjs
          node --check scripts/reserve-delivery-v2-initial-attempt.mjs
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/resume-delivery-v2-controller.mjs
          node --test test/v2-*.test.mjs
          npm run validate
          npm run verify:v2
          npm run verify:v2:complete
          gh aw compile --strict
          git diff --exit-code -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
          git diff --check

      - name: Create validated detached GitHub commit
        id: publish
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
          REMOTE_PARENT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "delivery-v2-remediator"
          git config user.email "delivery-v2-remediator@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation diff was produced" >&2
            exit 2
          fi
          git commit -m "fix(v2): close cumulative audit escape controls"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_OBJECT_TOKEN;
          const parent = process.env.REMOTE_PARENT;
          if (!repo || !token || !/^[0-9a-f]{40}$/.test(parent || '')) throw new Error('Missing detached-commit identity');
          const api = async (path, init = {}) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              ...init,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${init.method || 'GET'} ${path}: ${response.status} ${text}`);
            return text ? JSON.parse(text) : {};
          };
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const gitBuffer = (...args) => execFileSync('git', args);
          const changed = git('diff', '--name-only', '-z', 'HEAD^', 'HEAD').split('\0').filter(Boolean);
          const parentCommit = await api(`/git/commits/${parent}`);
          const entries = [];
          for (const path of changed) {
            let exists = true;
            try { execFileSync('git', ['cat-file', '-e', `HEAD:${path}`], { stdio: 'ignore' }); } catch { exists = false; }
            if (!exists) {
              let mode = '100644';
              try { mode = git('ls-tree', 'HEAD^', '--', path).split(/\s+/)[0] || mode; } catch {}
              entries.push({ path, mode, type: 'blob', sha: null });
              continue;
            }
            const mode = git('ls-tree', 'HEAD', '--', path).split(/\s+/)[0];
            const content = gitBuffer('show', `HEAD:${path}`).toString('base64');
            const blob = await api('/git/blobs', { method: 'POST', body: JSON.stringify({ content, encoding: 'base64' }) });
            entries.push({ path, mode, type: 'blob', sha: blob.sha });
          }
          const tree = await api('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: parentCommit.tree.sha, tree: entries }) });
          const commit = await api('/git/commits', {
            method: 'POST',
            body: JSON.stringify({ message: 'fix(v2): close cumulative audit escape controls', tree: tree.sha, parents: [parent] }),
          });
          console.log(`VALIDATED_FINAL_COMMIT_SHA=${commit.sha}`);
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${commit.sha}\n`);
          NODE

      - name: Record detached candidate
        shell: bash
        run: |
          echo "Validated detached candidate: ${{ steps.publish.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
