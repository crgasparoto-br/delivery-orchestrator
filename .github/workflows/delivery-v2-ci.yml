name: Delivery V2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: delivery-v2-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation:
    name: V2 platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch for bounded remediation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final independent-audit remediations
        run: node scripts/apply-v2-final-audit-remediation.mjs

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.88.7

      - name: Restore trusted CI and remove remediation transport
        shell: bash
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/delivery-v2-ci.yml" > .github/workflows/delivery-v2-ci.yml
          rm -f scripts/apply-v2-final-audit-remediation.mjs
          node -e "const fs=require('fs'); for (const f of ['scripts/run-delivery-v2-controller.mjs','scripts/resume-delivery-v2-controller.mjs']) { const s=fs.readFileSync(f,'utf8'); fs.writeFileSync(f,s.replace(/\n+$/,'\n')); }"

      - name: Validate final candidate before publication
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v2/controller-runtime.mjs
          node --check src/v2/persistent-state.mjs
          node --check src/v2/github-native-audit-runtime.mjs
          node --check scripts/guard-delivery-v2-reentry.mjs
          node --check scripts/run-delivery-v2-controller.mjs
          node --check scripts/resume-delivery-v2-controller.mjs
          node --check scripts/run-delivery-v2-github-audit.mjs
          node --test test/v2-*.test.mjs
          npm run validate
          npm run verify:v2
          npm run verify:v2:complete
          gh aw compile --strict
          git diff --exit-code -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
          git diff --check

      - name: Publish validated candidate bundle
        shell: bash
        env:
          REMOTE_PARENT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "delivery-v2-remediator"
          git config user.email "delivery-v2-remediator@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation diff was produced" >&2
            exit 2
          fi
          git commit -m "fix(v2): close final independent-audit blockers"
          FINAL_LOCAL_COMMIT="$(git rev-parse HEAD)"
          BUNDLE_ROOT="${RUNNER_TEMP}/delivery-v2-final-bundle"
          rm -rf "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/bundle/files"
          REMOTE_PARENT="$REMOTE_PARENT" FINAL_LOCAL_COMMIT="$FINAL_LOCAL_COMMIT" BUNDLE_ROOT="$BUNDLE_ROOT" node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const parent = process.env.REMOTE_PARENT;
          const finalCommit = process.env.FINAL_LOCAL_COMMIT;
          const root = process.env.BUNDLE_ROOT;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const gitBuffer = (...args) => execFileSync('git', args);
          const changed = gitBuffer('diff', '--name-only', '-z', parent, finalCommit).toString('utf8').split('\0').filter(Boolean);
          const manifest = [];
          for (const file of changed) {
            let exists = true;
            try { execFileSync('git', ['cat-file', '-e', `${finalCommit}:${file}`], { stdio: 'ignore' }); } catch { exists = false; }
            if (!exists) {
              const oldTree = git('ls-tree', parent, '--', file).split(/\s+/);
              manifest.push({ path: file, mode: oldTree[0] || '100644', deleted: true });
              continue;
            }
            const tree = git('ls-tree', finalCommit, '--', file).split(/\s+/);
            const mode = tree[0] || '100644';
            const target = path.join(root, 'bundle', 'files', file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, gitBuffer('show', `${finalCommit}:${file}`));
            manifest.push({ path: file, mode, deleted: false });
          }
          fs.writeFileSync(path.join(root, 'bundle', 'manifest.json'), JSON.stringify({ parent, files: manifest }, null, 2) + '\n');
          NODE
          BUNDLE_BRANCH="delivery-v2-final-transport-${GITHUB_RUN_ID}"
          git switch --orphan "$BUNDLE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R "$BUNDLE_ROOT/bundle" ./bundle
          git add bundle
          git commit -m "chore(v2): transport final validated candidate bundle"
          git push origin "HEAD:refs/heads/$BUNDLE_BRANCH"
          echo "Validated candidate bundle: $BUNDLE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
