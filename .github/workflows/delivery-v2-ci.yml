name: Delivery V2 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/v2/**'
      - 'test/v2-*.test.mjs'
      - 'actions/delivery-v2-risk/**'
      - 'src/cli.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'config/delivery-v2-requirements.json'
      - 'config/delivery-v2-targets/**'
      - 'schemas/delivery-v2-metrics.schema.json'
      - 'schemas/delivery-v2-requirements.schema.json'
      - 'schemas/delivery-v2-target-policy.schema.json'
      - 'scripts/**'
      - '.github/delivery-orchestrator-capabilities.json'
      - '.github/aw/actions-lock.json'
      - '.github/workflows/delivery-v2-*.yml'
      - '.github/workflows/delivery-v2-*.md'
      - '.github/workflows/delivery-v2-*.lock.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - 'docs/delivery-v2.md'
      - 'docs/delivery-v2/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: delivery-v2-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  foundation:
    name: V2 platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test repository
        run: npm test

      - name: Validate repository
        run: npm run validate

      - name: Verify Delivery V2 contract and terminal completeness
        run: npm run verify:v2

      - name: Syntax checks
        shell: bash
        run: |
          node --check src/cli.mjs
          for file in src/v2/*.mjs; do
            node --check "$file"
          done
          node --check actions/delivery-v2-risk/index.cjs
          for file in scripts/*.mjs; do
            node --check "$file"
          done
          for file in .github/scripts/*.mjs; do
            node --check "$file"
          done

      - name: Detect gh-aw worker identity drift
        id: worker-identity
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed_paths="$(git diff --name-only "$base" HEAD)"
          changed="$(printf '%s\n' "$changed_paths" | node scripts/should-compile-delivery-v2-workers.mjs)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Reuse trusted-base gh-aw attestation
        if: steps.worker-identity.outputs.changed == 'false'
        shell: bash
        run: echo "gh-aw worker sources, generated locks and compiler workflow identity are unchanged from the trusted base; reusing the base attestation."

      - name: Install pinned gh-aw
        if: steps.worker-identity.outputs.changed == 'true'
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c
        with:
          version: v0.89.15

      - name: Compile gh-aw workers
        if: steps.worker-identity.outputs.changed == 'true'
        id: compiled-workers
        shell: bash
        run: |
          gh aw compile --strict
          if git diff --quiet -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Emit compiled worker drift for deterministic remediation
        if: steps.worker-identity.outputs.changed == 'true' && steps.compiled-workers.outputs.drift == 'true'
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/delivery-v2-compiled-workers.tgz"
          tar -czf "$archive" .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json
          echo "DV2_LOCK_ARCHIVE_SHA256=$(sha256sum "$archive" | cut -d' ' -f1)"
          base64 -w 60000 "$archive" | sed 's/^/DV2_LOCK_ARCHIVE_CHUNK:/'

      - name: Verify compiled gh-aw workers
        if: steps.worker-identity.outputs.changed == 'true'
        shell: bash
        run: git diff --exit-code -- .github/workflows/delivery-v2-worker-*.lock.yml .github/aw/actions-lock.json

      - name: Smoke deterministic plan
        run: >-
          node src/cli.mjs plan-v2
          --repo crgasparoto-br/example
          --issue 1
          --provider copilot
          --risk fast
          --path apps/web/src/components/Example.tsx
