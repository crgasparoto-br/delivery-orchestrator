name: Delivery V2 - GitHub Native Audit

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository in owner/repo form
        required: true
        type: string
      target_issue:
        description: Target issue number
        required: true
        type: string
      target_pr:
        description: Exact target pull request number
        required: true
        type: string
      risk_profile:
        description: Effective risk profile for this exact material head
        required: true
        type: choice
        options: [standard, critical]
      source_workflow_run_id:
        description: Exact-head target CI workflow run id
        required: true
        type: string
      source_workflow_name:
        description: Trusted target CI workflow name
        required: true
        type: string
      source_workflow_path:
        description: Trusted target CI workflow path
        required: true
        type: string
      implementation_attempt:
        description: Material implementation/remediation attempt count
        required: true
        default: '1'
        type: string
      implementer_provider:
        description: AI provider that produced the audited material head
        required: true
        type: string
      implementer_worker_identity:
        description: Exact implementation worker workflow identity
        required: true
        type: string
      implementer_run_id:
        description: Exact implementation worker run that produced the audited material head
        required: true
        type: string
      prior_findings_json:
        description: Authoritative prior V2 finding lineage from preceding audit attempts
        required: true
        default: '[]'
        type: string
      dispatch_nonce:
        description: Deterministic controller dispatch correlation nonce
        required: true
        type: string

run-name: Delivery V2 audit ${{ inputs.dispatch_nonce }}

permissions:
  contents: read

concurrency:
  group: delivery-v2-audit-${{ inputs.target_repository }}-${{ inputs.target_pr }}
  cancel-in-progress: false

jobs:
  audit:
    name: Independent semantic audit
    runs-on: [self-hosted, linux, delivery-orchestrator]
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_ISSUE: ${{ inputs.target_issue }}
      TARGET_PR: ${{ inputs.target_pr }}
      AUDIT_RISK_PROFILE: ${{ inputs.risk_profile }}
      SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source_workflow_run_id }}
      SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
      SOURCE_WORKFLOW_PATH: ${{ inputs.source_workflow_path }}
      IMPLEMENTATION_ATTEMPT: ${{ inputs.implementation_attempt }}
      IMPLEMENTER_PROVIDER: ${{ inputs.implementer_provider }}
      IMPLEMENTER_WORKER_IDENTITY: ${{ inputs.implementer_worker_identity }}
      IMPLEMENTER_RUN_ID: ${{ inputs.implementer_run_id }}
      PRIOR_FINDINGS_JSON: ${{ inputs.prior_findings_json }}
      AUDIT_RESULT_PATH: /tmp/delivery-v2-github-audit-${{ github.run_id }}.json
      DELIVERY_ROLE_RUNTIME_ROOT: /tmp/delivery-v2-auditor-${{ github.run_id }}
      DELIVERY_ROLE_RUNTIME_WORKER: /tmp/delivery-v2-auditor-${{ github.run_id }}/role-runtime-worker.mjs
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'chatgpt' }}
      CODEX_AUDITOR_HOME: ${{ vars.CODEX_AUDITOR_HOME }}
      DELIVERY_IMPLEMENTER_USER: ${{ vars.DELIVERY_IMPLEMENTER_USER || 'delivery-implementer' }}
      DELIVERY_AUDITOR_USER: ${{ vars.DELIVERY_AUDITOR_USER || 'delivery-auditor' }}
      DELIVERY_AUDITOR_PROVIDER_GENERAL: ${{ vars.DELIVERY_AUDITOR_PROVIDER }}
      DELIVERY_AUDITOR_MODEL_GENERAL: ${{ vars.DELIVERY_AUDITOR_MODEL }}
      DELIVERY_STANDARD_AUDITOR_PROVIDER_CONFIG: ${{ vars.DELIVERY_STANDARD_AUDITOR_PROVIDER }}
      DELIVERY_STANDARD_AUDITOR_MODEL_CONFIG: ${{ vars.DELIVERY_STANDARD_AUDITOR_MODEL }}
      DELIVERY_CRITICAL_AUDITOR_PROVIDER_CONFIG: ${{ vars.DELIVERY_CRITICAL_AUDITOR_PROVIDER }}
      DELIVERY_CRITICAL_AUDITOR_MODEL_CONFIG: ${{ vars.DELIVERY_CRITICAL_AUDITOR_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      DELIVERY_GITHUB_READ_TOKEN: ${{ secrets.DELIVERY_GITHUB_READ_TOKEN }}
    steps:
      - name: Restrict target repository
        shell: bash
        run: |
          case "$TARGET_REPOSITORY" in
            crgasparoto-br/*) ;;
            *) echo "Target repository is outside the allowed owner: $TARGET_REPOSITORY" >&2; exit 2 ;;
          esac

      - name: Resolve audit AI policy
        shell: bash
        run: |
          set -euo pipefail
          case "$AUDIT_RISK_PROFILE" in
            standard)
              specific_provider="$DELIVERY_STANDARD_AUDITOR_PROVIDER_CONFIG"
              specific_model="$DELIVERY_STANDARD_AUDITOR_MODEL_CONFIG"
              ;;
            critical)
              specific_provider="$DELIVERY_CRITICAL_AUDITOR_PROVIDER_CONFIG"
              specific_model="$DELIVERY_CRITICAL_AUDITOR_MODEL_CONFIG"
              ;;
            *) echo "Unsupported audit risk profile: $AUDIT_RISK_PROFILE" >&2; exit 2 ;;
          esac
          provider="${specific_provider:-${DELIVERY_AUDITOR_PROVIDER_GENERAL:-codex}}"
          provider="$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]')"
          case "$provider" in
            codex|claude|copilot) ;;
            *) echo "Unsupported DELIVERY_AUDITOR_PROVIDER: $provider" >&2; exit 2 ;;
          esac
          model="${specific_model:-${DELIVERY_AUDITOR_MODEL_GENERAL:-}}"
          if [ -z "$model" ]; then
            case "$provider" in
              codex) model='gpt-5.6-sol' ;;
              claude) model='claude-opus-5' ;;
              copilot) model='gpt-5.3-codex' ;;
            esac
          fi
          if ! printf '%s' "$model" | grep -Eq '^[A-Za-z0-9._:/?=&+~-]+$'; then
            echo "Configured auditor model contains unsupported characters" >&2
            exit 2
          fi
          printf 'DELIVERY_AUDITOR_PROVIDER=%s\n' "$provider" >> "$GITHUB_ENV"
          printf 'DELIVERY_AUDITOR_MODEL_RESOLVED=%s\n' "$model" >> "$GITHUB_ENV"
          printf 'OPENAI_MODEL=%s\n' "$model" >> "$GITHUB_ENV"

      - name: Checkout trusted audit runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate isolated auditor runtime
        shell: bash
        run: |
          set -euo pipefail
          node_bin=/usr/local/bin/node
          npm_bin=/usr/local/bin/npm
          test -x "$node_bin"
          test -x "$npm_bin"
          test "$("$node_bin" -p 'Number(process.versions.node.split(".")[0])')" -ge 22
          test "$DELIVERY_IMPLEMENTER_USER" != "$DELIVERY_AUDITOR_USER"
          id "$DELIVERY_AUDITOR_USER" >/dev/null
          case "$DELIVERY_AUDITOR_PROVIDER" in
            codex)
              auditor_home="${CODEX_AUDITOR_HOME:-$(getent passwd "$DELIVERY_AUDITOR_USER" | cut -d: -f6)/.codex-delivery/auditor}"
              if [ "$CODEX_AUTH_MODE" = "chatgpt" ]; then
                sudo -n -u "$DELIVERY_AUDITOR_USER" -H -- test -r "$auditor_home/auth.json"
              elif [ "$CODEX_AUTH_MODE" = "api-key" ]; then
                test -n "$OPENAI_API_KEY"
              else
                echo "CODEX_AUTH_MODE must be chatgpt or api-key" >&2
                exit 2
              fi
              ;;
            claude) test -n "$ANTHROPIC_API_KEY" ;;
            copilot) test -n "$COPILOT_GITHUB_TOKEN" ;;
            *) echo "Unsupported auditor provider" >&2; exit 2 ;;
          esac
          test -n "$DELIVERY_AUDITOR_MODEL_RESOLVED"
          test -n "$DELIVERY_GITHUB_READ_TOKEN"

      - name: Install trusted runtime dependencies
        run: /usr/local/bin/npm ci --no-audit --no-fund

      - name: Install pinned Copilot CLI for Copilot audit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DELIVERY_AUDITOR_PROVIDER" != "copilot" ]; then
            exit 0
          fi
          root="${RUNNER_TEMP}/delivery-v2-copilot-cli-${GITHUB_RUN_ID}"
          /usr/local/bin/npm install --prefix "$root" @github/copilot@1.0.80 --no-audit --no-fund
          echo "$root/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare isolated auditor role runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n mkdir -p "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n cp src/role-runtime-worker.mjs src/files.mjs "$DELIVERY_ROLE_RUNTIME_ROOT/"
          sudo -n cp -a node_modules "$DELIVERY_ROLE_RUNTIME_ROOT/node_modules"
          sudo -n chown -R "$DELIVERY_AUDITOR_USER:$DELIVERY_AUDITOR_USER" "$DELIVERY_ROLE_RUNTIME_ROOT"
          sudo -n chmod -R u+rwX,go-rwx "$DELIVERY_ROLE_RUNTIME_ROOT"

      - name: Run exact-head GitHub-native audit
        run: /usr/local/bin/node scripts/run-delivery-v2-github-audit.mjs

      - name: Bind audit runtime identity to evidence
        shell: bash
        run: |
          /usr/local/bin/node --input-type=module -e "
            import fs from 'node:fs';
            const p = process.env.AUDIT_RESULT_PATH;
            const payload = JSON.parse(fs.readFileSync(p, 'utf8'));
            payload.auditRuntime = {
              provider: process.env.DELIVERY_AUDITOR_PROVIDER,
              model: process.env.DELIVERY_AUDITOR_MODEL_RESOLVED,
              risk: process.env.AUDIT_RISK_PROFILE,
              invoked: Number(payload.providerCalls || 0) > 0
            };
            fs.writeFileSync(p, JSON.stringify(payload, null, 2) + '\\n', { mode: 0o600 });
          "

      - name: Publish machine-readable result to target PR
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ env.AUDIT_RESULT_PATH }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_PR: ${{ inputs.target_pr }}
        with:
          github-token: ${{ secrets.DELIVERY_GITHUB_WRITE_TOKEN }}
          script: |
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            const compact = Buffer.from(JSON.stringify({
              candidateSha: payload.result.candidateSha,
              decision: payload.result.decision,
              requestFingerprint: payload.result.requestFingerprint,
              auditWorkflowRunId: payload.auditWorkflowRunId,
              auditRuntime: payload.auditRuntime,
              findings: payload.result.findings,
              modelUsage: payload.modelUsage ?? null,
            })).toString('base64');
            const body = [
              '<!-- delivery-v2-independent-audit -->',
              `<!-- delivery-v2-audit-json:${compact} -->`,
              '## Delivery V2 independent audit',
              '',
              `- Candidate: \`${payload.result.candidateSha}\``,
              `- Risk: \`${payload.request.candidate.risk.profile}\``,
              `- Auditor provider: \`${payload.auditRuntime.provider}\``,
              `- Auditor model: \`${payload.auditRuntime.model}\``,
              `- Decision: **${payload.result.decision}**`,
              `- Audit run: ${payload.auditWorkflowRunId}`,
              `- Request fingerprint: \`${payload.result.requestFingerprint}\``,
              `- Blocking findings: ${payload.result.findings.filter((finding) => finding.blocksRelease).length}`,
              '',
              '```json',
              JSON.stringify(payload.result.findings, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(process.env.TARGET_PR), body });

      - name: Upload audit result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-audit-${{ inputs.target_pr }}-${{ github.run_id }}
          path: ${{ env.AUDIT_RESULT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup isolated auditor runtime
        if: always()
        shell: bash
        run: |
          sudo -n rm -rf "$DELIVERY_ROLE_RUNTIME_ROOT"
          rm -f "$AUDIT_RESULT_PATH"
