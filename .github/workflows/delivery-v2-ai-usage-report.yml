name: Delivery V2 - AI Usage Report

on:
  workflow_dispatch:
    inputs:
      period:
        description: Reporting period (all|today|7d|month|custom). `custom` requires `from` and `to`.
        required: false
        default: month
        type: choice
        options:
          - all
          - today
          - 7d
          - month
          - custom
      from:
        description: Period start (ISO-8601 instant), required when period=custom.
        required: false
        type: string
      to:
        description: Period end (ISO-8601 instant), required when period=custom.
        required: false
        type: string
      timezone:
        description: UTC (default) or a fixed ±HH:MM offset. Named timezones are rejected.
        required: false
        default: UTC
        type: string
      repository:
        description: Optional repository filter (owner/repo).
        required: false
        type: string
      group_by:
        description: Comma-separated grouping dimensions.
        required: false
        default: repository,phase
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-v2-ai-usage-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Build AI usage & cost report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reads the single operational metrics store committed under
      # docs/delivery-v2/evidence/delivery-v2-metrics.json, which the Delivery V2 controllers
      # write through the canonical metrics.mjs contract. A missing store fails this step
      # loudly instead of silently publishing an empty report.
      - name: Build AI usage report (JSON)
        env:
          PERIOD: ${{ inputs.period }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          TIMEZONE: ${{ inputs.timezone }}
          REPOSITORY: ${{ inputs.repository }}
          GROUP_BY: ${{ inputs.group_by }}
        run: |
          set -euo pipefail
          mkdir -p ai-usage-report
          ARGS=(--period "${PERIOD:-month}")
          if [ "${PERIOD}" = "custom" ]; then
            if [ -z "${FROM}" ] || [ -z "${TO}" ]; then
              echo "period=custom requires both 'from' and 'to'" >&2
              exit 1
            fi
            ARGS+=(--from "${FROM}" --to "${TO}")
          fi
          if [ -n "${TIMEZONE}" ]; then
            ARGS+=(--timezone "${TIMEZONE}")
          fi
          if [ -n "${REPOSITORY}" ]; then
            ARGS+=(--repo "${REPOSITORY}")
          fi
          if [ -n "${GROUP_BY}" ]; then
            ARGS+=(--group-by "${GROUP_BY}")
          fi
          node scripts/ai-usage-report.mjs "${ARGS[@]}" --out ai-usage-report/ai-usage-report.json

      # CSV, HTML and the Job Summary are all rendered from that one JSON payload, so every
      # surface agrees on totals by construction.
      - name: Export CSV/HTML and publish Job Summary
        run: node scripts/ai-usage-export.mjs ai-usage-report/ai-usage-report.json ai-usage-report

      - name: Upload AI usage report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-report
          path: |
            ai-usage-report/ai-usage-report.json
            ai-usage-report/ai-usage-report.csv
            ai-usage-report/ai-usage-report.html
          if-no-files-found: error
          retention-days: 90
