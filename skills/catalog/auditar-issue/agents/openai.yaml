interface:
  display_name: Auditar Issue
  short_description: Audita em leitura, recompõe evidências remotas e assina parecer
    externo confiável.
  default_prompt: Use @auditar-issue para auditar esta entrega em modo somente leitura.
    Refaça os requisitos, congele head, base e merge preview, reconstrua a evidência
    remota, verifique o fluxo real e tente refutar a implementação. Emita parecer
    compatível com a independência do contexto e, somente em contexto realmente separado,
    produza relatório Ed25519 assinado por chave previamente confiada. Trate snapshots
    e gates da implementação apenas como alegações. Em modo controller, produza source-manifest,
    rederivacao, coverage-matrix e controller-audit-report schema 3 validado; resultado
    favoravel nesse modo deve ser apenas internally-approved. Em auditoria independente,
    rejeite pacote com narrativa do implementador e registre audit escapes do mesmo
    SHA.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
